name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Both: the plugin is built for Jellyfin 10.11 (net9.0) and Jellyfin 12 (net10.0) from one
      # tree, and the net9.0 test run needs the .NET 9 runtime as well as the .NET 10 SDK.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # The loudness integration tests drive a real encoder. Without ffmpeg they skip
      # themselves, so installing it here is what makes them actually run in CI.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.ThemeForge.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.ThemeForge.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.ThemeForge.sln -c Release --no-build --verbosity normal
